<div style="position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">

<p style="margin: 0 0 24px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B5A4C">Prologue</p>
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.02; letter-spacing: -0.02em">I love reading, but I haven't read <span style="font-style: italic; color: #7A1F2E">enough.</span></h1>
<p style="margin: 26px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(24px, 2.4vw, 31px); line-height: 1.3">Yet every book I've read, good and bad <svg aria-hidden="true" style="vertical-align: -3px" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 23 V13" stroke="#4E6B35" stroke-width="1.3"></path><path d="M12 18 C9 17 7 15 7 13 C10 14 11 15 12 18Z" fill="#4E6B35"></path><path d="M6 8 C6 3 18 3 18 8 C18 13 6 13 6 8Z" fill="#B5354B" stroke="#5E1020" stroke-width="0.8"></path><path d="M9.5 8 C9.5 5.5 14.5 5.5 14.5 8 C14.5 10 12 10.5 11.5 9" stroke="#5E1020" stroke-width="0.9"></path></svg>, leaves me pressed between pages.</p>
<p style="margin: 22px 0 0; max-width: 540px; font-size: 17px; line-height: 1.7; color: #4A3B30">From the mountains of Achebe to the hills of Morrison, from the East to the South: file the books with me, share your reviews and read mine. And if anyone's words have ever made you <sc-for list="{{verbs}}" as="v" hint-placeholder-count="10"><button type="button" class="verb" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="font-weight: {{v.weight}}">{{v.word}}</button>{{v.sep}}</sc-for>, don't think too hard. <a href="#write" style="font-weight: 500">Write it below.</a></p>
<a href="#bildungsroman" style="margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #7A1F2E; color: #F8F1E2; text-decoration: none"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85">Favourite genre</span><span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 21px">Bildungsroman</span></a>
</div>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stem: 'all', book: 0, verb: 'love' };
  }
  renderVals() {
    var self = this;
    var FLOWERS = {
      rose: { name: 'Rose', meaning: 'books that broke my heart a little', color: '#7A1F2E' },
      lily: { name: 'Lily', meaning: 'books that changed my mind', color: '#4E5B35' },
      orchid: { name: 'Orchid', meaning: 'rare, strange, impossible to forget', color: '#6E3470' }
    };
    // [title, author, flower, height, width, spine colour, gilt colour, finished, bildungsroman]
    var RAW = [
      ['Stay With Me', 'Ayọ̀bámi Adébáyọ̀', 'rose', 262, 46, '#6E1C2A', '#E2C77E', '2022, 2023, 2024 and 2025', false],
      ['The Kite Runner', 'Khaled Hosseini', 'rose', 284, 48, '#59602F', '#F3D9A4', '[Month], 2026', true],
      ['Hotel 21', 'Senta Rich', 'rose', 236, 40, '#A9772A', '#2A1A10', '[Month, Year]', false],
      ['Middle of the Night', 'Riley Sager', 'orchid', 288, 50, '#2F4030', '#E2C77E', '[Month, Year]', false],
      ['Baby Teeth', 'Zoje Stage', 'orchid', 250, 42, '#D9C8A6', '#5E1020', '[Month, Year]', false],
      ['The Alchemist', 'Paulo Coelho', 'lily', 232, 38, '#8A3B1E', '#F0D9A0', '[Month, Year]', false],
      ['Queen Bey', 'ed. Veronica Chambers', 'lily', 276, 48, '#23304A', '#E2C77E', '[Month, Year]', false],
      ['Take It Back', 'Kia Abdullah', 'lily', 258, 44, '#1F3B3A', '#E2C77E', '[Month, Year]', false],
      ['[Book title]', '[Author]', 'rose', 244, 38, '#4B2A44', '#D9B97A', '[Month, Year]', false],
      ['[Book title]', '[Author]', 'lily', 226, 36, '#5A3420', '#E2C77E', '[Month, Year]', false],
      ['[Book title]', '[Author]', 'rose', 282, 46, '#591624', '#E2C77E', '[Month, Year]', false],
      ['[Book title]', '[Author]', 'orchid', 240, 40, '#9C7448', '#2A1A10', '[Month, Year]', false]
    ];
    var hits = function (r, s) { return s === 'all' || (s === 'bild' ? r[8] : r[2] === s); };
    var stem = this.state.stem;
    var sel = this.state.book;
    var pickStem = function (s) {
      return function () {
        var first = self.state.book;
        if (s !== 'all') {
          for (var i = 0; i < RAW.length; i++) { if (hits(RAW[i], s)) { first = i; break; } }
        }
        self.setState({ stem: s, book: first });
      };
    };
    var books = RAW.map(function (r, i) {
      var match = hits(r, stem);
      var tf = 'none';
      if (i === sel) tf = 'translateY(-18px)';
      else if (match && stem !== 'all') tf = 'translateY(-6px)';
      else if (i === 5) tf = 'rotate(-4deg)';
      return {
        title: r[0], h: r[3], w: r[4], bg: r[5], gilt: r[6], bild: r[8],
        op: match ? 1 : 0.2, tf: tf,
        isRose: r[2] === 'rose', isLily: r[2] === 'lily', isOrchid: r[2] === 'orchid',
        aria: r[0] + ', filed under ' + FLOWERS[r[2]].name + (r[8] ? ', bildungsroman' : ''),
        pick: function () { self.setState({ book: i }); }
      };
    });
    var count = RAW.filter(function (r) { return hits(r, stem); }).length;
    var shelfNote = stem === 'all'
      ? 'Pull a book off the shelf to read its card. Or pick a flower and the shelf sorts itself.'
      : (stem === 'bild' ? count + ' on my favourite shelf: the bildungsroman. Look for the pink ribbon.' : count + ' filed under ' + FLOWERS[stem].name + ': ' + FLOWERS[stem].meaning + '.');
    var pills = [['all', 'Every book'], ['rose', 'Rose'], ['lily', 'Lily'], ['orchid', 'Orchid'], ['bild', 'Bildungsroman']].map(function (p) {
      var on = stem === p[0];
      return { label: p[1], pick: pickStem(p[0]), pressed: on ? 'true' : 'false', bg: on ? '#E2C77E' : 'transparent', fg: on ? '#2A1A10' : '#EFE4CF' };
    });
    var WORDS = ['love', 'clap', 'cry', 'laugh', 'dance', 'think', 'sleep', 'fight', 'run', 'give'];
    var verbs = WORDS.map(function (w, i) {
      var on = self.state.verb === w;
      return {
        word: w,
        sep: i < WORDS.length - 2 ? ', ' : (i === WORDS.length - 2 ? ' or ' : ''),
        pressed: on ? 'true' : 'false',
        weight: on ? 600 : 400,
        pick: function () { self.setState({ verb: w }); }
      };
    });
    var cr = RAW[sel];
    var cf = FLOWERS[cr[2]];
    var op = function (s) { return stem === 'all' || stem === s ? 1 : 0.4; };
    var bar = function (s) { return stem === s ? FLOWERS[s].color : 'transparent'; };
    return {
      intro: true,
      verb: this.state.verb, verbs: verbs,
      pickRose: pickStem('rose'), pickLily: pickStem('lily'), pickOrchid: pickStem('orchid'),
      roseOp: op('rose'), lilyOp: op('lily'), orchidOp: op('orchid'),
      roseBar: bar('rose'), lilyBar: bar('lily'), orchidBar: bar('orchid'),
      books: books, pills: pills, shelfNote: shelfNote,
      card: { no: String(sel + 1).padStart(2, '0'), title: cr[0], author: cr[1], flower: cf.name, meaning: cf.meaning, color: cf.color, finished: cr[7], genre: cr[8] ? 'Bildungsroman, my favourite' : '[Genre]' }
    };
  }
}

dcBoot(Component);
</script>
