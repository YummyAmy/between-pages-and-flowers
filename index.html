<p style="margin: 0 0 24px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B5A4C">Prologue</p>
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.02; letter-spacing: -0.02em">I love reading, but I haven't read <span style="font-style: italic; color: #7A1F2E">enough.</span></h1>
<p style="margin: 26px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(24px, 2.4vw, 31px); line-height: 1.3">Yet every book I've read, good and bad <svg aria-hidden="true" style="vertical-align: -3px" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 23 V13" stroke="#4E6B35" stroke-width="1.3"></path><path d="M12 18 C9 17 7 15 7 13 C10 14 11 15 12 18Z" fill="#4E6B35"></path><path d="M6 8 C6 3 18 3 18 8 C18 13 6 13 6 8Z" fill="#B5354B" stroke="#5E1020" stroke-width="0.8"></path><path d="M9.5 8 C9.5 5.5 14.5 5.5 14.5 8 C14.5 10 12 10.5 11.5 9" stroke="#5E1020" stroke-width="0.9"></path></svg>, leaves me pressed between pages.</p>
<p style="margin: 22px 0 0; max-width: 540px; font-size: 17px; line-height: 1.7; color: #4A3B30">From the mountains of Achebe and Hosseini to the hills of Morrison, from the east to the south, file these novels with me, and write what you think. And if anyone's words ever made you <sc-for list="{{verbs}}" as="v" hint-placeholder-count="8"><button type="button" class="verb" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="font-weight: {{v.weight}}">{{v.word}}</button>{{v.sep}}</sc-for>, <a href="#write" style="font-weight: 500">show it here</a>. This is a safe space.</p>
<a href="#bildungsroman" style="margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #7A1F2E; color: #F8F1E2; text-decoration: none"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85">Favourite genre</span><span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 21px">Bildungsroman</span></a>
</div>

<div style="flex: 1 1 500px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div role="group" aria-label="Sort the shelf by flower" style="width: 100%; display: flex; gap: 4px; align-items: flex-end; justify-content: space-between">

        sep: i < WORDS.length - 2 ? ', ' : (i === WORDS.length - 2 ? ' or ' : ''),
        pressed: on ? 'true' : 'false',
        weight: on ? 600 : 400,
        pick: function () { self.setState({ verb: w }); }
      };
    });
    var cr = RAW[sel];
    var cf = FLOWERS[cr[2]];
    var op = function (s) { return stem === 'all' || stem === s ? 1 : 0.4; };
    var bar = function (s) { return stem === s ? FLOWERS[s].color : 'transparent'; };
    return {
      intro: true,
      holiday: Date.now() < new Date(2026, 10, 30).getTime(),
      verb: this.state.verb, verbs: verbs,
      pickRose: pickStem('rose'), pickLily: pickStem('lily'), pickOrchid: pickStem('orchid'),
      roseOp: op('rose'), lilyOp: op('lily'), orchidOp: op('orchid'),
      roseBar: bar('rose'), lilyBar: bar('lily'), orchidBar: bar('orchid'),
      books: books, pills: pills, shelfNote: shelfNote,
      card: { title: cr[0], author: cr[1], genre: cr[9] + (cr[8] ? ' · bildungsroman' : ''), stars: starsOf(cr[10]), pct: pctOf(cr[10]), starsLabel: cr[10] + ' out of 5 stars' }
    };
  }
}

dcBoot(Component);
</script>
