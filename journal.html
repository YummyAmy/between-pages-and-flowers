<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    var self = this;
    var F = { rose: ['Rose', '#7A1F2E'], lily: ['Lily', '#4E5B35'], orchid: ['Orchid', '#6E3470'] };
    var RAW = [
      ['The Kite Runner', 'Khaled Hosseini', 'Review', 'rose', 'assets/14e098094ae7e158415e0aed80324a2f.jpg', 'The Kite Runner on a café table next to a cookie and a laptop', true],
      ['Queen Bey', 'ed. Veronica Chambers', 'Journal', 'lily', 'assets/6cefedd11b6ea39a6c6d8e003adfec45.jpg', 'Holding Queen Bey, edited by Veronica Chambers, in a Carter jersey', false],
      ['Middle of the Night', 'Riley Sager', 'Review', 'orchid', 'assets/3f9a18041cc9f94dd8e8ee5f7bfcabc1.jpg', 'Middle of the Night by a window with half-open blinds', false],
      ['Hotel 21', 'Senta Rich', 'Journal', 'rose', 'assets/25fc927952c8c29215d61b49ab63807a.jpg', 'A notebook page of handwritten notes on Hotel 21', false],
      ['Baby Teeth', 'Zoje Stage', 'Journal', 'orchid', 'assets/89f192a593533483715a90398a394c7f.jpg', 'Baby Teeth on a wooden floor', false],
      ['Take It Back', 'Kia Abdullah', 'Review', 'lily', 'assets/d550a10195312e4309c846368b94bb5c.jpg', 'Take It Back, hardcover', false],
      ['Stay With Me', 'Ayọ̀bámi Adébáyọ̀', 'Journal', 'rose', '', '', false],
      ['The Alchemist', 'Paulo Coelho', 'Review', 'lily', '', '', false]
    ];
    var tab = this.state.tab;
    var entries = RAW.filter(function (r) { return tab === 'all' || r[2] === tab; }).map(function (r) {
      return {
        book: r[0], author: r[1], type: r[2], typeColor: r[2] === 'Review' ? '#4E5B35' : '#7A1F2E',
        flower: F[r[3]][0], flowerColor: F[r[3]][1], hasPhoto: !!r[4], photo: r[4], alt: r[5], bild: r[6]
      };
    });
    var tabs = [['all', 'Everything'], ['Journal', 'Journal'], ['Review', 'Reviews']].map(function (t) {
      var on = tab === t[0];
      return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#2A1E17' : 'transparent', fg: on ? '#F4EDE1' : '#2A1E17', pick: function () { self.setState({ tab: t[0] }); } };
    });
    return { entries: entries, tabs: tabs };
  }
}

dcBoot(Component);
</script>
